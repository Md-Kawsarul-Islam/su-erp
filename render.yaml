services:
  - type: web
    name: su-erp-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: su-erp-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "su-erp-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: pgsql
    name: su-erp-db
    databaseName: su_erp
    user: su_erp_user
